<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #1e1e2e;
    }

    .calculator {
      width: 320px;
      background-color: #2b2b3c;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .display {
      width: 100%;
      height: 80px;
      background-color: #181825;
      color: #ffffff;
      border-radius: 10px;
      margin-bottom: 20px;
      padding: 15px;
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .previous-operand {
      color: #a6adc8;
      font-size: 0.9rem;
      min-height: 1.2rem;
    }

    .current-operand {
      font-size: 2rem;
      font-weight: bold;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      font-size: 1.25rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #3b3b52;
      color: #ffffff;
      transition: background-color 0.15s;
    }

    button:hover {
      background-color: #4c4c69;
    }

    .span-two {
      grid-column: span 2;
    }

    .operator {
      background-color: #f38ba8;
      color: #11111b;
      font-weight: bold;
    }

    .operator:hover {
      background-color: #f5a3b8;
    }

    .action {
      background-color: #fab387;
      color: #11111b;
      font-weight: bold;
    }

    .action:hover {
      background-color: #fbc4a2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </div>
    <div class="buttons">
      <button class="action span-two" data-action="clear">AC</button>
      <button class="action" data-action="delete">DEL</button>
      <button class="operator" data-operator="÷">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator" data-operator="*">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator" data-operator="-">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="operator" data-operator="+">+</button>

      <button data-number=".">.</button>
      <button data-number="0">0</button>
      <button class="operator span-two" data-action="equals">=</button>
    </div>
  </div>

  <script>
    class Calculator {
      constructor(previousTextElement, currentTextElement) {
        this.previousTextElement = previousTextElement;
        this.currentTextElement = currentTextElement;
        this.clear();
      }

      clear() {
        this.currentOperand = '0';
        this.previousOperand = '';
        this.operation = undefined;
      }

      delete() {
        if (this.currentOperand === 'Error') {
          this.clear();
          return;
        }
        this.currentOperand = this.currentOperand.toString().slice(0, -1);
        if (this.currentOperand === '' || this.currentOperand === '-') {
          this.currentOperand = '0';
        }
      }

      appendNumber(number) {
        if (this.currentOperand === 'Error') this.clear();
        if (number === '.' && this.currentOperand.includes('.')) return;
        if (this.currentOperand === '0' && number !== '.') {
          this.currentOperand = number.toString();
        } else {
          this.currentOperand = this.currentOperand.toString() + number.toString();
        }
      }

      chooseOperation(operation) {
        if (this.currentOperand === 'Error') return;
        if (this.previousOperand !== '') {
          this.compute();
        }
        this.operation = operation;
        this.previousOperand = this.currentOperand;
        this.currentOperand = '0';
      }

      compute() {
        let computation;
        const prev = parseFloat(this.previousOperand);
        const current = parseFloat(this.currentOperand);
        if (isNaN(prev) || isNaN(current)) return;

        switch (this.operation) {
          case '+':
            computation = prev + current;
            break;
          case '-':
            computation = prev - current;
            break;
          case '*':
            computation = prev * current;
            break;
          case '÷':
            if (current === 0) {
              this.currentOperand = 'Error';
              this.previousOperand = '';
              this.operation = undefined;
              return;
            }
            computation = prev / current;
            break;
          default:
            return;
        }

        // Round to avoid floating-point issues like 0.1 + 0.2 = 0.30000000000000004
        this.currentOperand = Math.round(computation * 100000000) / 100000000;
        this.operation = undefined;
        this.previousOperand = '';
      }

      updateDisplay() {
        this.currentTextElement.innerText = this.currentOperand;
        if (this.operation != null) {
          this.previousTextElement.innerText = `${this.previousOperand} ${this.operation}`;
        } else {
          this.previousTextElement.innerText = '';
        }
      }
    }

    const previousTextElement = document.getElementById('previous-operand');
    const currentTextElement = document.getElementById('current-operand');
    const calculator = new Calculator(previousTextElement, currentTextElement);

    document.querySelectorAll('[data-number]').forEach(button => {
      button.addEventListener('click', () => {
        calculator.appendNumber(button.dataset.number);
        calculator.updateDisplay();
      });
    });

    document.querySelectorAll('[data-operator]').forEach(button => {
      button.addEventListener('click', () => {
        calculator.chooseOperation(button.dataset.operator);
        calculator.updateDisplay();
      });
    });

    document.querySelector('[data-action="equals"]').addEventListener('click', () => {
      calculator.compute();
      calculator.updateDisplay();
    });

    document.querySelector('[data-action="clear"]').addEventListener('click', () => {
      calculator.clear();
      calculator.updateDisplay();
    });

    document.querySelector('[data-action="delete"]').addEventListener('click', () => {
      calculator.delete();
      calculator.updateDisplay();
    });
  </script>
</body>
</html>
